spring.application.name=salesforce-crud-backend

server.port=${PORT:8080}

# Salesforce OAuth
salesforce.login-url=https://login.salesforce.com
salesforce.client-id=${SALESFORCE_CLIENT_ID}
salesforce.client-secret=${SALESFORCE_CLIENT_SECRET}
salesforce.redirect-uri=${SALESFORCE_REDIRECT_URI:http://localhost:8080/api/auth/callback}

# Salesforce REST API
salesforce.api-version=${SALESFORCE_API_VERSION:v65.0}